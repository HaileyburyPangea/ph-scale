name: Build GitHub Pages

on:
  push:
    branches: ['1.7', 'expanded-materials']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: ph-scale
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone simulation with pinned release dependencies
        run: node ph-scale/scripts/build-pages.mjs
      - name: Check all screens in Chrome
        run: node ph-scale/scripts/smoke-pages.cjs
      - name: Save browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: expanded-screenshots
          path: ph-scale/build/screenshots
      - name: Check out the original version for the site root
        if: github.ref == 'refs/heads/expanded-materials'
        uses: actions/checkout@v4
        with:
          ref: '1.7'
          path: stable/ph-scale
      - name: Keep the original site and add the expanded preview
        if: github.ref == 'refs/heads/expanded-materials'
        run: |
          node stable/ph-scale/scripts/build-pages.mjs
          cp -R ph-scale/build/pages stable/ph-scale/build/pages/expanded
          cp -R stable/ph-scale/build/pages/. ph-scale/build/pages/
      - name: Save standalone site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ph-scale/build/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
