name: Build GitHub Pages

on:
  push:
    branches: ['1.7']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: ph-scale
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone simulation with pinned release dependencies
        run: node ph-scale/scripts/build-pages.mjs
      - name: Check all screens in Chrome
        run: node ph-scale/scripts/smoke-pages.cjs
      - name: Save standalone site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ph-scale/build/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
